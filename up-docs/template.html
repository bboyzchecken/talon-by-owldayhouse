  UP Docs — demo ฟรีโดย Owl Day House

<style>
/* ===== ฟอนต์ราชการ (ฝังในไฟล์ — PDF ตรงทุกเครื่อง) ===== */
@font-face{
  font-family:'TH Sarabun New';
  src:url(data:font/woff2;base64,__FONT_R__) format('woff2');
  font-weight:normal;font-style:normal;
}
@font-face{
  font-family:'TH Sarabun New';
  src:url(data:font/woff2;base64,__FONT_B__) format('woff2');
  font-weight:bold;font-style:normal;
}

/* ===== UI หน้าจอ (ไม่ติดไปกับงานพิมพ์) — สีอ้างอิงแบรนด์ ODH ===== */
:root{
  --navy:#28254C; --navy-deep:#1B1938; --gold:#E9A41B; --gold-soft:#FBEFD3; --paper:#FBF8F1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#EEECE4;color:var(--navy);font-family:'IBM Plex Sans Thai','TH Sarabun New',-apple-system,'Segoe UI',sans-serif}
.app-header{background:linear-gradient(135deg,var(--navy-deep),var(--navy));color:#fff;padding:18px 22px;border-bottom:4px solid var(--gold)}
.app-header h1{margin:0;font-size:22px}
.app-header p{margin:4px 0 0;font-size:15px;opacity:.85}
main{max-width:1280px;margin:0 auto;padding:20px}

/* การ์ดเลือกเอกสาร */
#docCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border:2px solid transparent;border-top:4px solid var(--navy);border-radius:12px;padding:16px;cursor:pointer;text-align:left;font:inherit;box-shadow:0 2px 8px rgba(40,37,76,.08);transition:.15s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card h2{margin:0 0 6px;font-size:19px;color:var(--navy)}
.card p{margin:0;font-size:15px;color:#5a577a;line-height:1.5}
.card .tag{display:inline-block;margin-top:10px;font-size:13px;background:var(--gold-soft);color:#8a6410;border-radius:99px;padding:2px 10px}

/* workspace ฟอร์ม + พรีวิว */
#workspace{display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;align-items:start}
#workspace[hidden]{display:none}
#formPanel{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(40,37,76,.08)}
#formPanel h2{margin:0 0 2px;font-size:19px}
#formPanel .docsub{margin:0 0 12px;font-size:14px;color:#5a577a}
.backbtn{background:none;border:none;color:var(--navy);font:inherit;font-size:15px;cursor:pointer;padding:0;margin-bottom:10px;text-decoration:underline}
fieldset{border:1px solid #e4e2d8;border-radius:10px;margin:0 0 14px;padding:10px 12px 12px}
legend{font-size:14px;font-weight:600;color:#8a6410;padding:0 6px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
label:first-of-type{margin-top:0}
input[type=text],input[type=number],select,textarea{width:100%;padding:8px 10px;border:1px solid #cfcdc0;border-radius:8px;font:inherit;font-size:16px;background:var(--paper)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
textarea{resize:vertical;min-height:74px}
.hint{font-size:13px;color:#8b8875;margin-top:3px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:400;margin:8px 0 0;cursor:pointer}
.chk input{width:auto}
.modechips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.chip{border:1.5px solid #cfcdc0;background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sturow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.sturow input{flex:1}
.sturow .stuphone{max-width:120px}
.sturow .del{flex:0 0 auto;background:none;border:1px solid #cfcdc0;border-radius:8px;width:34px;height:34px;cursor:pointer;color:#a33;font-size:16px;line-height:1}
.addstu{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:8px;padding:8px 12px;font:inherit;font-size:15px;cursor:pointer;width:100%}
.printbtn{width:100%;background:var(--gold);color:var(--navy-deep);border:none;border-radius:10px;padding:13px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;margin-top:6px;box-shadow:0 3px 10px rgba(233,164,27,.4)}
.printbtn:hover{filter:brightness(1.05)}
.printtip{font-size:13px;color:#8b8875;text-align:center;margin-top:6px}

/* พรีวิว */
#previewPanel{min-width:0}
#fitWarn{display:none;background:var(--gold-soft);border:1px solid var(--gold);color:#7a5a0e;border-radius:8px;padding:8px 12px;font-size:15px;margin-bottom:10px}
.sheetbox{margin:0 auto 18px;overflow:hidden;box-shadow:0 4px 18px rgba(40,37,76,.18)}
.pagelabel{font-size:14px;color:#5a577a;text-align:center;margin:0 0 6px}

/* ===== ตัวเอกสาร (สิ่งที่พิมพ์จริง) ===== */
.sheet{
  position:relative;background:#fff;color:#000;
  font-family:'TH Sarabun New','TH SarabunPSK','Sarabun',sans-serif;
  font-size:16pt;line-height:normal;overflow:hidden;
}
.sheet.letter{width:21.59cm;height:27.9cm}   /* Letter — ลดสูง 0.04cm กันหน้าเกินตอนพิมพ์ */
.sheet.a4{width:21cm;height:29.66cm}         /* A4 เฉพาะใบนอกหลักสูตร */
.sheet p{margin:0;white-space:pre-wrap}
.just{text-align:justify}
.ctr{text-align:center}
.rgt{text-align:right}
.ind2{text-indent:2.54cm}   /* เยื้องบรรทัดแรก 2 tab */
.ind1{text-indent:1.27cm}
.sheet .sig-align{margin-left:30%;margin-right:0;text-align:center}  /* กึ่งกลางค่อนขวา ตามต้นฉบับ — .sheet นำหน้าให้ชนะ .sheet p{margin:0} */
.docheader{display:flex;justify-content:space-between;align-items:flex-start}
.dh-right p{text-align:left}
.crest{display:block;height:2.8cm;width:auto;margin:0 auto 0.15cm}  /* ตรา ม.พะเยา เหนือบล็อกที่อยู่ (ASSETS.md) */
.dh-left.with-crest{margin-top:2.95cm}  /* ดัน "ที่ อว..." ลงมาให้ตรงบรรทัดแรกของที่อยู่ */
.datep{text-align:center;margin-top:6pt}
.stu{margin-left:1.27cm}    /* ลิสต์นิสิตเลขไทย */
.doctitle{text-align:center;font-weight:bold;font-size:1.375em}  /* หัวใบตอบรับ 22pt */
.sigspace{height:1.7cm}     /* เว้นที่เซ็นชื่อ */
.docfooter{position:absolute;left:var(--ml,3cm);bottom:0.7cm}
.docfooter p{text-align:left}
.signwrap{width:9.5cm;margin-left:auto;text-align:center;margin-top:20pt}
.signwrap p{margin-top:10pt}
.blank{display:inline-block;min-width:4.5cm;border-bottom:1px dotted #000}
.miss{display:inline-block;min-width:2.8cm;border-bottom:1px dotted #999;background:var(--gold-soft)} /* ช่องที่ยังไม่กรอก — ไฮไลต์เฉพาะบนจอ */

.app-footer{text-align:center;font-size:14px;color:#5a577a;padding:18px}
.app-footer a{color:var(--navy)}

/* มือถือ: ฟอร์มอยู่บน พรีวิวอยู่ล่าง */
@media(max-width:900px){
  #workspace{grid-template-columns:1fr}
  main{padding:12px}
}

/* ===== โหมดพิมพ์ ===== */
@media print{
  .no-print{display:none !important}
  body{background:#fff}
  main{max-width:none;padding:0;margin:0}
  #fitWarn{display:none !important}
  .sheetbox{margin:0 !important;width:auto !important;height:auto !important;box-shadow:none;overflow:visible;page-break-after:always}
  .sheetbox:last-child{page-break-after:auto}
  .sheet{transform:none !important}
  .miss{background:none}
}
</style>

<body>

<header class="app-header no-print">
  <h1>UP Docs — เครื่องมือออกเอกสารฝึกงาน / สหกิจศึกษา</h1>
  <p>คณะบริหารธุรกิจและนิเทศศาสตร์ มหาวิทยาลัยพะเยา · กรอกครั้งเดียว เติมทุกจุด · พิมพ์เป็น PDF ได้ทันที</p>
</header>

<main>
  <!-- ขั้น 1: การ์ดเลือกประเภทเอกสาร -->
  <section id="docCards" class="no-print" aria-label="เลือกประเภทเอกสาร"></section>
  <p id="openSaved" class="no-print" style="text-align:center;margin-top:16px">
    <button class="chip" onclick="document.getElementById('importFile').click()">⬆ เปิดไฟล์ที่บันทึกไว้ (.json)</button>
  </p>
  <input type="file" id="importFile" accept="application/json,.json" style="display:none">

  <!-- ขั้น 2: ฟอร์ม + พรีวิวสด -->
  <div id="workspace" hidden>
    <aside id="formPanel" class="no-print"></aside>
    <section id="previewPanel">
      <div id="fitWarn" class="no-print"></div>
      <div id="pages"></div>
    </section>
  </div>
</main>

<footer class="app-footer no-print">
  เครื่องมือรุ่นสาธิต · พัฒนาโดย บริษัท อาวล์ เดย์ เฮ้าส์ จำกัด · <a href="https://owldayhouse.com">owldayhouse.com</a>
</footer>

<script>
'use strict';
/* ===== ข้อมูลจากสเปก (gen จาก up-docs/files/ — อย่าแก้ตรงนี้ ให้แก้ JSON แล้ว build ใหม่) ===== */
const REF = __REF_JSON__;
const TPL = __TPL_JSON__;
// ตรามหาวิทยาลัยพะเยา (data URI) — build.py ฝังให้เมื่อมีไฟล์ใน up-docs/assets/logo/ ไม่มีไฟล์ = หัวจดหมายไม่มีตรา
const CREST_DATA = '__CREST__';

/* ===== ค่าคงที่ / helper ===== */
const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MODE_LABEL = {internship:'ฝึกงาน', coop:'สหกิจศึกษา', cwie:'CWIE'};
const DEFAULT_CANCEL_REASON = 'เนื่องด้วยนิสิตมีปัญหาเกี่ยวกับการลงทะเบียนเรียนไม่ครบตามจำนวนหน่วยกิตของมหาวิทยาลัย ทำให้นิสิตไม่สามารถเข้ารับการฝึกงานได้';

// แปลงเลขอารบิก → เลขไทย (ผู้ใช้พิมพ์อารบิกได้ ระบบแปลงตอนเรนเดอร์)
const thNum = s => String(s).replace(/[0-9]/g, d => '๐๑๒๓๔๕๖๗๘๙'[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== ข้อมูลประกอบ UI ต่อเอกสาร =====
   stuMax: ส่งตัว/นอกหลักสูตร/ยกเลิก ล็อก 1 คน — ต้นฉบับมีแค่โครง 1 คน
   TODO(ask): รูปแบบหลายคนของ 3 ใบนี้ รอเจ้าของตอบ (DECISIONS.md D-multi) */
const DOC_META = {
  request:        {title:'หนังสือขอความอนุเคราะห์', desc:'ขอรับนิสิตเข้าฝึกงาน / สหกิจ / CWIE — พิมพ์ครั้งเดียวได้พร้อมใบตอบรับ', tag:'พร้อมใบตอบรับ · 2 หน้า',
                   stuMax:4, stuPhone:true, fields:['docNo','date','recipient','courseCode','program','major','semester','yearEduBE','orgName','dateStart','dateEnd','replyBy']},
  sendoff:        {title:'หนังสือส่งตัวนิสิต', desc:'ส่งตัวนิสิตเข้ารับการฝึกงาน / สหกิจ / CWIE ณ สถานประกอบการ', tag:'3 โหมด',
                   stuMax:1, stuPhone:true, fields:['docNo','date','recipient','orgName','major','dateStart','dateEnd']},
  thanks:         {title:'หนังสือขอบคุณ', desc:'ขอบคุณสถานประกอบการหลังนิสิตฝึกงาน / ปฏิบัติสหกิจศึกษาเสร็จสิ้น', tag:'1–4 คน',
                   stuMax:4, stuPhone:false, fields:['docNo','date','recipient','orgName','major','dateStart','dateEnd']},
  extracurricular:{title:'ฝึกงานนอกหลักสูตร', desc:'ขอความอนุเคราะห์รับนิสิตฝึกงานระหว่างปิดภาคการศึกษา', tag:'กระดาษ A4',
                   stuMax:1, stuPhone:false, fields:['docNo','date','recipient','program','major','yearLevel','dateStart','dateEnd']},
  cancel:         {title:'หนังสือยกเลิกการฝึกงาน', desc:'แจ้งยกเลิกการเข้ารับการฝึกงาน อ้างอิงหนังสือฉบับเดิม', tag:'อ้างเลขหนังสือเดิม',
                   stuMax:1, stuPhone:false, fields:['docNo','date','recipient','refDocNo','refDate','orgName','major','dateStart','dateEnd','cancelReason']},
};

// นิยามช่องกรอก (label / ตัวอย่าง / ชนิด)
const FIELD_DEF = {
  docNo:       {label:'เลขที่หนังสือ (ต่อท้าย อว ๗๓๒๕/)', hint:'เช่น 0590'},
  recipient:   {label:'เรียน (ผู้รับหนังสือ)', hint:'เช่น ผู้จัดการฝ่ายทรัพยากรบุคคล บริษัท ใจดี จำกัด'},
  orgName:     {label:'ชื่อสถานประกอบการ / หน่วยงาน', hint:'เช่น บริษัท ใจดี จำกัด — ใช้เติมทุกจุดรวมถึงใบตอบรับ'},
  courseCode:  {label:'รหัสรายวิชา', hint:'เช่น 128382'},
  program:     {label:'หลักสูตร', datalist:'programList'},
  major:       {label:'สาขาวิชา', hint:'เช่น การตลาดดิจิทัล', datalist:'majorList'},
  semester:    {label:'ภาคการศึกษา', select:['ต้น','ปลาย']},
  yearEduBE:   {label:'ปีการศึกษา (พ.ศ.)', hint:'เช่น 2569', num:true},
  dateStart:   {label:'วันเริ่มปฏิบัติงาน', hint:'เช่น 1 ธันวาคม 2569'},
  dateEnd:     {label:'วันสิ้นสุด', hint:'เช่น 31 มีนาคม 2570'},
  replyBy:     {label:'ขอผลตอบกลับภายในวันที่', hint:'เช่น 30 พฤศจิกายน 2569'},
  yearLevel:   {label:'ชั้นปี', hint:'เช่น 3', num:true},
  refDocNo:    {label:'เลขที่หนังสือเดิม (อว ๗๓๒๕/…)', hint:'เลขหนังสือขอความอนุเคราะห์ฉบับที่ยกเลิก'},
  refDate:     {label:'ลงวันที่ (หนังสือเดิม)', hint:'เช่น 5 มิถุนายน 2569'},
  cancelReason:{label:'เหตุผลการยกเลิก', textarea:true},
};

/* ===== state เดียว — กรอกครั้งเดียวเติมทุกจุด ===== */
const now = new Date();
const state = {
  docType: null,
  mode: 'internship',
  docNo:'', recipient:'', orgName:'', courseCode:'',
  program:'บริหารธุรกิจบัณฑิต', major:'', semester:'ปลาย',
  yearEduBE: String(now.getFullYear()+543),
  dateStart:'', dateEnd:'', replyBy:'', yearLevel:'',
  refDocNo:'', refDate:'',
  cancelReason: DEFAULT_CANCEL_REASON,
  date: {month: TH_MONTHS[now.getMonth()], yearBE: String(now.getFullYear()+543), full:false, day:''},
  students: [{name:'', phone:''}],
  signerId: 's1',
  printAttach: true,
};

// นิสิตที่ใช้จริงตามเพดานของใบนั้น (ใบ 1 คนใช้แค่คนแรก)
const effStudents = () => state.students.slice(0, DOC_META[state.docType]?.stuMax || 4);

/* ===== Persistence: autosave (localStorage) + บันทึก/เปิดไฟล์ .json =====
   แพตเทิร์นเดียวกับ owl-docs — localStorage เป็น optional (try/catch)
   ตามข้อกำหนดสเปก: ถ้าใช้ไม่ได้ (เช่นบน artifact preview) เครื่องมือยังทำงานปกติ */
const STORAGE_KEY = 'up-docs-state-v1';
const SAVED_KEYS = ['docType','mode','docNo','recipient','orgName','courseCode','program','major',
  'semester','yearEduBE','dateStart','dateEnd','replyBy','yearLevel','refDocNo','refDate',
  'cancelReason','signerId','printAttach'];

function collectData(){
  const d = {app:'up-docs', version:1};
  SAVED_KEYS.forEach(k => { d[k] = state[k]; });
  d.date = {...state.date};
  d.students = state.students.map(s => ({name:s.name, phone:s.phone}));
  return d;
}
function applyData(d){
  if(!d || d.app!=='up-docs' || !DOC_META[d.docType]) throw new Error('ไม่ใช่ไฟล์ของ UP Docs');
  SAVED_KEYS.forEach(k => { if(d[k]!==undefined) state[k] = d[k]; });
  if(d.date) state.date = {...state.date, ...d.date};
  if(Array.isArray(d.students) && d.students.length){
    state.students = d.students.slice(0,4).map(s => ({name:s.name||'', phone:s.phone||''}));
  }
  openWorkspace();
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(collectData())); }catch(e){} }
function loadState(){ try{ const s=localStorage.getItem(STORAGE_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function exportJSON(){
  const blob = new Blob([JSON.stringify(collectData(),null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = ('updocs-'+state.docType+'-'+(state.docNo||'draft')+'.json').replace(/\s+/g,'_');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function importJSON(ev){
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{ applyData(JSON.parse(reader.result)); }
    catch(err){ alert('เปิดไฟล์ไม่ได้ — ไม่ใช่ไฟล์ .json ของ UP Docs'); }
  };
  reader.readAsText(file);
}

/* ===== token → ค่า ===== */
function dateText(){
  const d = state.date;
  if(!d.month && !d.yearBE) return '';
  const day = d.full && d.day ? thNum(d.day)+' ' : '';
  return (day + (d.month||'') + ' ' + thNum(d.yearBE||'')).trim();
}
function studentNamesInline(){
  const names = effStudents().map(s=>s.name).filter(Boolean);
  if(!names.length) return '';
  if(names.length===1) return names[0];
  return names.slice(0,-1).join(' , ') + ' และ' + names[names.length-1];
}
function resolveToken(key, modeObj){
  const stu = effStudents();
  if(key==='docNo_prefix') return REF.issuer.doc_no_prefix;
  if(key==='blank') return {html:'<span class="blank">&nbsp;</span>'};
  if(key.startsWith('mode.')) return modeObj?.[key.slice(5)] ?? '';
  const m = key.match(/^student\.(\d)\.(name|phone)$/);
  if(m){ const s = stu[+m[1]-1]; if(!s) return ''; return m[2]==='phone' ? thNum(s.phone) : s.name; }
  switch(key){
    case 'docNo': return thNum(state.docNo);
    case 'dateText': return dateText();
    case 'attachCount': case 'studentCount': return thNum(stu.length);
    case 'yearEduBE': case 'yearLevel': case 'refDocNo': case 'courseCode': return thNum(state[key]);
    case 'dateStart': case 'dateEnd': case 'replyBy': case 'refDate': return thNum(state[key]);
    case 'dateRange': return (state.dateStart||state.dateEnd) ? thNum(state.dateStart)+' ถึง '+thNum(state.dateEnd) : '';
    case 'studentNamesInline': return studentNamesInline();
    default: return state[key] ?? '';
  }
}
// แทน {{token}} ในข้อความ — ช่องว่างที่ยังไม่กรอกจะขึ้นเส้นประ (ไฮไลต์เฉพาะบนจอ)
function tok(text, modeObj){
  return text.replace(/\{\{([^}]+)\}\}|([^{]+|\{)/g, (all, key, lit) => {
    if(lit !== undefined) return esc(lit);
    const v = resolveToken(key.trim(), modeObj);
    if(v && v.html) return v.html;
    return v ? esc(v) : '<span class="miss">&nbsp;</span>';
  });
}

/* ===== เรนเดอร์บล็อกเอกสารตามสเปก templates.json ===== */
function paraHTML(b, modeObj){
  const cls = [];
  if(b.align==='thai_justify') cls.push('just');
  if(b.align==='center') cls.push('ctr');
  if(b.align==='right') cls.push('rgt');
  if(b.align==='center_ish') cls.push('sig-align');
  if(b.indent==='firstline2tab') cls.push('ind2');
  if(b.indent==='firstline1tab') cls.push('ind1');
  if(b.type==='title') cls.push('doctitle');
  const st = [];
  if(b.space_before_pt) st.push('margin-top:'+b.space_before_pt+'pt');
  return `<p class="${cls.join(' ')}" style="${st.join(';')}">${tok(b.text, modeObj)}</p>`;
}
function signerHTML(){
  const sg = REF.signers.find(s=>s.id===state.signerId) || REF.signers[0];
  const lines = sg.title_lines.map(l=>`<p>${esc(l)}</p>`).join('');
  return `<div class="sig-align"><div class="sigspace"></div><p>(${esc(sg.name)})</p>${lines}</div>`;
}
function renderBlock(b, modeObj){
  switch(b.type){
    case 'list_numbered': // รายชื่อนิสิต ๑.–๔. เยื้อง 1.27ซม.
      return effStudents().map((s,i)=>{
        const line = b.item
          .replace('{{no}}', thNum(i+1))
          .replace('{{student.name}}', s.name ? esc(s.name) : '<span class="miss">&nbsp;</span>')
          .replace('{{student.phone}}', s.phone ? thNum(esc(s.phone)) : '<span class="miss">&nbsp;</span>');
        const st = i===0 && b.space_before_pt ? `margin-top:${b.space_before_pt}pt` : '';
        return `<p class="stu" style="${st}">${line}</p>`;
      }).join('');
    case 'list_names':    // ใบขอบคุณหลายคน — ชื่ออย่างเดียว กึ่งกลาง
      return effStudents().map(s=>`<p class="ctr">${s.name ? esc(s.name) : '<span class="miss">&nbsp;</span>'}</p>`).join('');
    case 'signer':
      return signerHTML();
    case 'signline':      // ช่องเซ็นของบริษัท (ใบตอบรับ)
      return `<div class="signwrap">${b.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`;
    default:              // subject / recipient / attach / para / field / title / closing
      return paraHTML(b, modeObj);
  }
}
function headerHTML(){
  const c = TPL._shared_chrome.header;
  const right = c.right_lines.map(l=>`<p>${esc(l)}</p>`).join('');
  const crest = CREST_DATA
    ? `<img class="crest" src="${CREST_DATA}" alt="ตรามหาวิทยาลัยพะเยา">` : '';
  return `<div class="docheader"><div class="dh-left${crest?' with-crest':''}"><p>${tok(c.left)}</p></div><div class="dh-right">${crest}${right}</div></div>`;
}
function footerHTML(){
  return `<div class="docfooter">${TPL._shared_chrome.footer.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`;
}

/* ===== ประกอบทั้งแผ่น ===== */
function sheetHTML(docKey, modeKey){
  const d = TPL.documents[docKey];
  const modeObj = d.modeText?.[modeKey] || {};
  const marginKey = d.margins==='acceptance_form' ? 'acceptance_form' : 'letter_head';
  const mg = REF.margins_cm[marginKey];
  let html = '';
  (d.chrome||[]).forEach(k=>{
    if(k==='header') html += headerHTML();
    if(k==='date')   html += `<p class="datep">${tok(TPL._shared_chrome.date.text)}</p>`;
  });
  const body = Array.isArray(d.body)
    ? d.body
    : (effStudents().length>1 && d.body.many ? d.body.many : d.body.single);
  body.forEach(b=>{ html += renderBlock(b, modeObj); });
  if(d.footer) html += footerHTML();
  const pad = `padding:${mg.top}cm ${mg.right}cm ${mg.bottom}cm ${mg.left}cm;--ml:${mg.left}cm`;
  return `<div class="sheet ${d.paper}" style="${pad}">${html}</div>`;
}

/* ===== พรีวิว + บังคับ 1 หน้า ===== */
function renderPreview(){
  if(!state.docType) return;
  const meta = DOC_META[state.docType];
  const doc = TPL.documents[state.docType];
  const pagesEl = document.getElementById('pages');
  const jobs = [{key:state.docType, mode:state.mode, label:doc.th_name}];
  // ใบขอ → พิมพ์ใบตอบรับตามหลัง (โหมด cwie ใช้ใบตอบรับสหกิจ)
  if(state.docType==='request' && state.printAttach){
    jobs.push({key:'acceptance', mode: state.mode==='internship'?'internship':'coop', label:'ใบตอบรับ (เอกสารแนบ — บริษัทลงนาม)'});
  }
  pagesEl.innerHTML = jobs.map((j,i)=>
    `<p class="pagelabel no-print">หน้า ${i+1} · ${esc(j.label)}</p><div class="sheetbox">${sheetHTML(j.key, j.mode)}</div>`
  ).join('');
  // @page ตามกระดาษของใบหลัก (letter ทุกใบ ยกเว้นนอกหลักสูตร = A4)
  document.getElementById('pageSize').textContent = `@page{size:${doc.paper==='a4'?'A4':'letter'};margin:0}`;
  document.title = 'UP Docs — ' + meta.title;
  fitAll();
  rescale();
  saveState(); // autosave ทุกครั้งที่มีการแก้ไข
}

// วัดความสูงจริง ถ้าเกิน 1 หน้า ค่อย ๆ ลดฟอนต์ทีละ 0.25pt (ต่ำสุด 13pt) + เตือนบนจอ
function fitAll(){
  const warns = [];
  document.querySelectorAll('#pages .sheet').forEach((sheet,i)=>{
    sheet.style.fontSize = '';
    let size = 16;
    while(sheet.scrollHeight > sheet.clientHeight+1 && size > 13){
      size -= 0.25;
      sheet.style.fontSize = size+'pt';
    }
    if(size < 16) warns.push(`หน้า ${i+1}: เนื้อหายาวกว่าปกติ ระบบย่อฟอนต์เหลือ ${size}pt เพื่อให้จบใน 1 หน้า`);
    if(sheet.scrollHeight > sheet.clientHeight+1) warns.push(`หน้า ${i+1}: เนื้อหายังยาวเกินหน้า แม้ย่อฟอนต์แล้ว — ลองย่อข้อความ`);
  });
  const w = document.getElementById('fitWarn');
  w.style.display = warns.length ? 'block' : 'none';
  w.textContent = warns.join(' · ');
}

// ย่อพรีวิวให้พอดีความกว้างจอ (ตัวเอกสารขนาดจริงเป็น ซม.)
function rescale(){
  const panel = document.getElementById('previewPanel');
  const avail = panel.clientWidth;
  document.querySelectorAll('#pages .sheetbox').forEach(box=>{
    const sheet = box.firstElementChild;
    sheet.style.transform = '';
    const w = sheet.offsetWidth, h = sheet.offsetHeight;
    const s = Math.min(1, avail / w);
    sheet.style.transform = `scale(${s})`;
    sheet.style.transformOrigin = 'top left';
    box.style.width  = (w*s)+'px';
    box.style.height = (h*s)+'px';
  });
}
window.addEventListener('resize', rescale);

/* ===== ฟอร์ม ===== */
function inputHTML(key){
  const f = FIELD_DEF[key];
  if(f.select){
    const opts = f.select.map(o=>`<option ${state[key]===o?'selected':''}>${o}</option>`).join('');
    return `<label>${f.label}</label><select data-k="${key}">${opts}</select>`;
  }
  if(f.textarea) return `<label>${f.label}</label><textarea data-k="${key}">${esc(state[key])}</textarea>`;
  const dl = f.datalist ? `list="${f.datalist}"` : '';
  return `<label>${f.label}</label><input type="text" ${f.num?'inputmode="numeric"':''} data-k="${key}" value="${esc(state[key])}" ${dl}>` +
         (f.hint?`<div class="hint">${f.hint}</div>`:'');
}
function dateInputHTML(){
  const monthOpts = TH_MONTHS.map(m=>`<option ${state.date.month===m?'selected':''}>${m}</option>`).join('');
  return `<label>วันที่ออกหนังสือ</label>
    <div class="row">
      <select data-dk="month">${monthOpts}</select>
      <input type="text" inputmode="numeric" data-dk="yearBE" value="${esc(state.date.yearBE)}" placeholder="พ.ศ.">
    </div>
    <label class="chk"><input type="checkbox" data-dk="full" ${state.date.full?'checked':''}> ระบุวันที่เต็ม (วัน เดือน ปี)</label>
    <div id="dayWrap" style="${state.date.full?'':'display:none'};margin-top:6px">
      <input type="text" inputmode="numeric" data-dk="day" value="${esc(state.date.day)}" placeholder="วันที่ เช่น 3">
    </div>
    <div class="hint">แสดงบนหนังสือเป็นเลขไทยอัตโนมัติ เช่น "${dateText()||TH_MONTHS[now.getMonth()]+' '+thNum(now.getFullYear()+543)}"</div>`;
}
function studentsHTML(meta){
  const stu = state.students.slice(0, meta.stuMax);
  const rows = stu.map((s,i)=>`
    <div class="sturow">
      <input type="text" placeholder="ชื่อ-สกุล (พร้อมคำนำหน้า) เช่น นางสาวสมศรี ใจดี" data-sk="name" data-si="${i}" value="${esc(s.name)}">
      ${meta.stuPhone?`<input class="stuphone" type="text" inputmode="numeric" placeholder="เบอร์โทร" data-sk="phone" data-si="${i}" value="${esc(s.phone)}">`:''}
      ${stu.length>1?`<button class="del" data-del="${i}" title="ลบ">✕</button>`:''}
    </div>`).join('');
  const addBtn = stu.length < meta.stuMax ? `<button class="addstu" id="addStu">+ เพิ่มนิสิต (สูงสุด ${meta.stuMax} คน)</button>` : '';
  const lockNote = meta.stuMax===1 ? '<div class="hint">แบบฟอร์มต้นฉบับของใบนี้รองรับนิสิต 1 คนต่อฉบับ</div>' : '';
  return rows + addBtn + lockNote;
}
function signerHTMLForm(){
  const opts = REF.signers.map(s=>{
    const pending = s.name.includes('__');
    return `<option value="${s.id}" ${pending?'disabled':''} ${state.signerId===s.id?'selected':''}>${pending?'(รอข้อมูลผู้ลงนาม)':esc(s.name)}</option>`;
  }).join('');
  return `<label>ผู้ลงนาม</label><select id="signerSel">${opts}</select>
    <div class="hint">รายชื่อผู้ลงนามอีก 5 ท่านอยู่ระหว่างรอข้อมูลจากคณะ</div>`;
}
function renderForm(){
  const meta = DOC_META[state.docType];
  const doc = TPL.documents[state.docType];
  const hasModes = (doc.modes||[]).length > 1;
  const modeChips = hasModes ? `<fieldset><legend>ประเภทการปฏิบัติงาน</legend><div class="modechips">${
    doc.modes.map(m=>`<button class="chip ${state.mode===m?'on':''}" data-mode="${m}">${MODE_LABEL[m]||m}</button>`).join('')
  }</div></fieldset>` : '';
  const fieldsHTML = meta.fields.map(k => k==='date' ? dateInputHTML() : inputHTML(k)).join('');
  const attachOpt = state.docType==='request'
    ? `<label class="chk"><input type="checkbox" id="printAttach" ${state.printAttach?'checked':''}> พิมพ์ใบตอบรับแนบท้าย (รวม 2 หน้า)</label>` : '';
  document.getElementById('formPanel').innerHTML = `
    <button class="backbtn" id="backBtn">← เลือกเอกสารอื่น</button>
    <h2>${meta.title}</h2>
    <p class="docsub">${esc(doc.th_name)}</p>
    ${modeChips}
    <fieldset><legend>ข้อมูลหนังสือ</legend>${fieldsHTML}</fieldset>
    <fieldset><legend>นิสิต</legend>${studentsHTML(meta)}</fieldset>
    <fieldset><legend>ผู้ลงนาม</legend>${signerHTMLForm()}</fieldset>
    ${attachOpt}
    <button class="printbtn" id="printBtn">🖨 พิมพ์ / บันทึกเป็น PDF</button>
    <div class="printtip">ในหน้าต่างพิมพ์ เลือกปลายทาง "Save as PDF" — ขนาดกระดาษถูกตั้งให้อัตโนมัติ</div>
    <div class="row" style="margin-top:10px">
      <button class="chip" id="exportBtn">⬇ บันทึกไฟล์</button>
      <button class="chip" id="importBtn">⬆ เปิดไฟล์</button>
    </div>
    <div class="printtip">💾 บันทึกอัตโนมัติในเบราว์เซอร์นี้ · ไฟล์ .json ใช้เก็บงานหรือย้ายไปทำต่อเครื่องอื่น</div>
    <datalist id="programList">${REF.programs.filter(p=>!p.includes('__')).map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
    <datalist id="majorList"><option value="การตลาดดิจิทัล"></datalist>`;
  bindForm();
}
function bindForm(){
  const panel = document.getElementById('formPanel');
  panel.querySelectorAll('[data-k]').forEach(el=>{
    el.addEventListener('input', ()=>{ state[el.dataset.k] = el.value; renderPreview(); });
  });
  panel.querySelectorAll('[data-dk]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const k = el.dataset.dk;
      if(k==='full'){ state.date.full = el.checked; document.getElementById('dayWrap').style.display = el.checked?'':'none'; }
      else state.date[k] = el.value;
      renderPreview();
    });
  });
  panel.querySelectorAll('[data-sk]').forEach(el=>{
    el.addEventListener('input', ()=>{ state.students[+el.dataset.si][el.dataset.sk] = el.value; renderPreview(); });
  });
  panel.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.students.splice(+el.dataset.del,1); renderForm(); renderPreview(); });
  });
  panel.querySelectorAll('[data-mode]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.mode = el.dataset.mode; renderForm(); renderPreview(); });
  });
  document.getElementById('addStu')?.addEventListener('click', ()=>{
    state.students.push({name:'',phone:''}); renderForm(); renderPreview();
  });
  document.getElementById('signerSel').addEventListener('change', e=>{ state.signerId = e.target.value; renderPreview(); });
  document.getElementById('printAttach')?.addEventListener('change', e=>{ state.printAttach = e.target.checked; renderPreview(); });
  document.getElementById('printBtn').addEventListener('click', ()=>window.print());
  document.getElementById('exportBtn').addEventListener('click', exportJSON);
  document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
  document.getElementById('backBtn').addEventListener('click', ()=>{
    state.docType = null;
    document.getElementById('workspace').hidden = true;
    document.getElementById('docCards').style.display = '';
    document.getElementById('openSaved').style.display = '';
    document.getElementById('pages').innerHTML = '';
    document.title = 'UP Docs — เครื่องมือออกเอกสารฝึกงาน คณะบริหารธุรกิจและนิเทศศาสตร์ ม.พะเยา';
  });
}

// เปิดหน้าฟอร์ม+พรีวิวของ state.docType ปัจจุบัน (ใช้ทั้งตอนคลิกการ์ด/เปิดไฟล์/กู้ autosave)
function openWorkspace(){
  document.getElementById('docCards').style.display = 'none';
  document.getElementById('openSaved').style.display = 'none';
  document.getElementById('workspace').hidden = false;
  renderForm();
  renderPreview();
}

/* ===== หน้าเลือกเอกสาร (การ์ดใหญ่ ชัดเจน — แก้ปัญหา dropdown เดิมสับสน) ===== */
function renderCards(){
  document.getElementById('docCards').innerHTML = Object.entries(DOC_META).map(([k,m])=>`
    <button class="card" data-doc="${k}">
      <h2>${m.title}</h2><p>${m.desc}</p><span class="tag">${m.tag}</span>
    </button>`).join('');
  document.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.docType = el.dataset.doc;
      const modes = TPL.documents[state.docType].modes || [];
      state.mode = modes[0] || 'internship';
      openWorkspace();
    });
  });
}
renderCards();
document.getElementById('importFile').addEventListener('change', importJSON);

// กู้งานล่าสุดจาก autosave (ถ้ามีและใช้ localStorage ได้)
try{
  const saved = loadState();
  if(saved && DOC_META[saved.docType]) applyData(saved);
}catch(e){ /* ไฟล์เก่าเสีย/ไม่มี — เริ่มหน้าเลือกการ์ดตามปกติ */ }
</script>
