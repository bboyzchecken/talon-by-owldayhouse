<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>Cover</title>
<style>
html,body{height:100%;margin:0;background:var(--surface)}
.c{position:relative;width:960px;height:320px;overflow:hidden}
.c svg{position:absolute;inset:0}
.n1{fill:var(--brand-block)}.g{fill:var(--gold)}.s{fill:var(--surface-soft)}
.ring{fill:none;stroke:var(--white);stroke-width:3}.pupil{fill:var(--gold)}
.t{position:absolute;left:32px;bottom:32px;width:440px}
.n{margin:0;font-family:var(--font-display);font-weight:700;font-size:96px;line-height:.95;letter-spacing:-.04em;color:var(--text)}
.u{margin:12px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-2)}
</style></head>
<body><div class="c">
<svg viewBox="0 0 960 320" width="960" height="320" aria-hidden="true">
<!-- blocks: brand-block 256px slab, gold 160px disc, surface-soft 160px field
     arrangement: one tall slab bleeding off top and bottom, disc and field beside it, generous white around
     pattern: owl-eye rings, the brand's literal motif, on the slab
     scales: gaps space-3 and space-4, disc radius-full, rings step space-4 -->
<rect class="n1" x="560" y="0" width="256" height="320"/>
<circle class="ring" cx="688" cy="160" r="88"/><circle class="ring" cx="688" cy="160" r="64"/><circle class="pupil" cx="688" cy="160" r="40"/>
<circle class="g" cx="912" cy="104" r="80"/>
<rect class="s" x="832" y="208" width="128" height="112"/>
</svg>
<div class="t"><p class="n">Owl Day House</p><p class="u">สร้างระบบ สร้างกระแส สร้างลูกค้า</p></div>
</div></body></html>
