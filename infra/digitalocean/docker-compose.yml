# ODH internal tools — DigitalOcean Droplet (12 USD: 1 vCPU, 2 GB RAM).
#
# Four services: PostgreSQL 16, the Go API (reachable only inside this
# network), the public intake service for the quote form on owldayhouse.com,
# and Caddy, which terminates HTTPS for both hostnames, serves the exported
# static UI and reverse-proxies to the two Go programs.
#
# Lives at /opt/odh-internal/docker-compose.yml on the Droplet, next to .env.

name: odh-internal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    # Tuned for 2 GB of RAM shared with the API and Caddy. max_connections is
    # deliberately low and matches POSTGRES_MAX_OPEN_CONNS in .env.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=25
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=500
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Never published to the host: the database is reachable only from this
    # compose network. UFW blocks 5432 as a second line of defence.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 900m

  api:
    build:
      context: ./api
      args:
        COMMIT: ${COMMIT:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      TZ: Asia/Bangkok
    depends_on:
      postgres:
        condition: service_healthy
    # Internal only — Caddy is the single way in.
    expose:
      - "5000"
    mem_limit: 400m

  # The public intake (apps/api/cmd/intake) behind api.owldayhouse.com. It
  # gets no env_file on purpose: .env holds the JWT secret, the R2 keys and
  # the database owner's password, and none of that belongs in the one
  # process that faces the open internet. It connects as odh_intake, which
  # the API creates on boot with INSERT on inbound_requests and nothing else.
  #
  # Off until switched on: set COMPOSE_PROFILES=intake in .env once the
  # bot-check key (ALTCHA_HMAC_KEY, or Turnstile's), the salt and the role
  # password are there (README.md,
  # "The public intake"). Without it, `docker compose up` leaves this service
  # out and the CRM deploys exactly as before.
  intake:
    profiles: ["intake"]
    build:
      context: ./api
      target: intake
      # The same COMMIT as `api`, so both images share one build stage and the
      # Go code is compiled once. With a different value the stage differs,
      # Docker compiles everything twice at the same time, and on 1 vCPU / 2 GB
      # that ran past the deploy's 30-minute limit.
      args:
        COMMIT: ${COMMIT:-unknown}
    restart: unless-stopped
    environment:
      ENV: production
      TZ: Asia/Bangkok
      INTAKE_PORT: "5200"
      INTAKE_CORS_ORIGINS: ${INTAKE_CORS_ORIGINS:-https://owldayhouse.com,https://www.owldayhouse.com}
      INTAKE_IP_SALT: ${INTAKE_IP_SALT:-}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: odh_intake
      POSTGRES_PASSWORD: ${INTAKE_POSTGRES_PASSWORD:-}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_SSLMODE: disable
    depends_on:
      # The API creates the intake's role on boot; until it is healthy the
      # role may not exist yet.
      api:
        condition: service_healthy
    expose:
      - "5200"
    mem_limit: 100m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ODH_DOMAIN: ${ODH_DOMAIN}
      # intake.localhost until the real hostname is set: Caddy gives a
      # .localhost name a local certificate and never asks Let's Encrypt, so
      # an unset value cannot burn the ACME rate limit on a missing A record.
      ODH_INTAKE_DOMAIN: ${ODH_INTAKE_DOMAIN:-intake.localhost}
      TZ: Asia/Bangkok
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    mem_limit: 200m

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
