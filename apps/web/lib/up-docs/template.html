      /* ===== UI หน้าจอ (ไม่ติดไปกับงานพิมพ์) — สีอ้างอิงแบรนด์ ODH ===== */
      :root {
        --navy: #28254c;
        --navy-deep: #1b1938;
        --gold: #e9a41b;
        --gold-soft: #fbefd3;
        --paper: #fbf8f1;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: #eeece4;
        color: var(--navy);
        font-family:
          "IBM Plex Sans Thai",
          "TH Sarabun New",
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .app-header {
        background: linear-gradient(135deg, var(--navy-deep), var(--navy));
        color: #fff;
        padding: 18px 22px;
        border-bottom: 4px solid var(--gold);
      }
      .app-header h1 {
        margin: 0;
        font-size: 24px;
      }
      .app-header p {
        margin: 4px 0 0;
        font-size: 17px;
        opacity: 0.85;
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 20px;
      }

      /* การ์ดเลือกเอกสาร */
      #docCards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 14px;
      }
      .card {
        background: #fff;

      /* ส่ง event เข้า gtag ของ "หน้าแม่" (owldayhouse.com/up-docs) ซึ่งโหลด property up-docs

   กรณีเปิดไฟล์เดี่ยว (ไม่อยู่ใน iframe) และตั้ง GA_ID ไว้ → โหลด gtag ของตัวเองไว้ fallback */
      window.track = function () {};
      (function () {
        var GA_ID = "G-3XWGSN9WKG";
        var haveGA = GA_ID && GA_ID.indexOf("G-") === 0;
        function parentGtag() {
          try {
            if (
              window.parent &&
              window.parent !== window &&
              typeof window.parent.gtag === "function"

              return window.parent.gtag;
          } catch (e) {}

        if (haveGA && !parentGtag()) {

          gtag("js", new Date());
          gtag("config", GA_ID);

          var p = params || {};
          if (haveGA) p.send_to = GA_ID;
          var g =
            parentGtag() ||
            (typeof window.gtag === "function" ? window.gtag : null);
          if (g) {
            try {
              g("event", ev, p);
            } catch (e) {}
          }

   แพตเทิร์นเดียวกับ owl-docs — localStorage เป็น optional (try/catch)
   ตามข้อกำหนดสเปก: ถ้าใช้ไม่ได้ (เช่นบน artifact preview) เครื่องมือยังทำงานปกติ */
      const STORAGE_KEY = "up-docs-state-v1";
      const SAVED_KEYS = [
        "docType",
        "mode",
        "docNo",
        "recipient",
        "orgName",
        "courseCode",
        "program",
        "major",
        "semester",
        "yearEduBE",

        "replyBy",
        "yearLevel",
        "refDocNo",
        "refDate",
        "cancelReason",
        "signerId",
        "printAttach",
      ];

      function collectData() {
        const d = { app: "up-docs", version: 1 };
        SAVED_KEYS.forEach((k) => {
          d[k] = state[k];
        });
        d.date = { ...state.date };
        d.students = state.students.map((s) => ({
          name: s.name,
          phone: s.phone,
        }));
        d.customSigner = { ...state.customSigner };
        return d;
      }
      function applyData(d) {
        if (!d || d.app !== "up-docs" || !DOC_META[d.docType])
          throw new Error("ไม่ใช่ไฟล์ของ UP Docs");
        SAVED_KEYS.forEach((k) => {
          if (d[k] !== undefined) state[k] = d[k];
        });
        if (d.date) state.date = { ...state.date, ...d.date };
        if (d.customSigner)
          state.customSigner = { ...state.customSigner, ...d.customSigner };
        if (Array.isArray(d.students) && d.students.length) {
          state.students = d.students
            .slice(0, 4)
            .map((s) => ({ name: s.name || "", phone: s.phone || "" }));
        }
        openWorkspace();
      }
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(collectData()));
        } catch (e) {}
      }
      function loadState() {
        try {
          const s = localStorage.getItem(STORAGE_KEY);
          return s ? JSON.parse(s) : null;
        } catch (e) {
          return null;
        }

      // ใช้ร่วมกันทั้งชื่อไฟล์ .json และชื่อไฟล์ PDF (เบราว์เซอร์ใช้ document.title เป็นชื่อไฟล์ตอน Save as PDF)
      function docBaseName() {
        const meta = DOC_META[state.docType];
        const parts = [meta.title];
        if (state.docNo) parts.push("เลขที่" + state.docNo);
        if (state.orgName) parts.push(state.orgName);
        const d = new Date(),
          p = (n) => String(n).padStart(2, "0");
        parts.push(
          `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`,
        );
        // ตัดอักขระต้องห้ามในชื่อไฟล์ + ยุบช่องว่างในแต่ละส่วนให้กระชับ
        return parts
          .map((s) =>
            s
              .replace(/[\/\\:*?"<>|]+/g, "")
              .replace(/\s+/g, "")
              .trim(),
          )
          .join("_");
      }
      function exportFilename() {
        return docBaseName() + ".json";
      }

      // พิมพ์/บันทึก PDF — ตั้งชื่อไฟล์ผ่าน document.title ของหน้าแม่ (Next.js) ชั่วคราว
      // เพราะเครื่องมือรันใน iframe และเบราว์เซอร์ดึงชื่อไฟล์ PDF จาก title ของหน้าบนสุด
      function printDoc() {
        // event ROI หลัก: 1 การพิมพ์ ≈ 1 เอกสารที่ออกจริง ≈ เวลาที่ประหยัดเทียบพิมพ์เองใน Word
        track("doc_print", {
          doc_type: state.docType,
          doc_mode: state.mode,
          student_count: effStudents().length,
          with_attachment: state.docType === "request" && state.printAttach,
        });
        const name = docBaseName();
        const selfPrev = document.title;
        let parentDoc = null,
          parentPrev;
        try {
          if (window.parent && window.parent !== window)
            parentDoc = window.parent.document;
        } catch (e) {
          parentDoc = null;
        }
        document.title = name;
        if (parentDoc) {
          parentPrev = parentDoc.title;
          parentDoc.title = name;
        }
        const restore = () => {
          document.title = selfPrev;
          if (parentDoc) {
            try {
              parentDoc.title = parentPrev;
            } catch (e) {}
          }
        };
        window.addEventListener("afterprint", restore, { once: true });
        window.print();
      }
      function exportJSON() {
        const blob = new Blob([JSON.stringify(collectData(), null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = exportFilename();
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        track("doc_export", { doc_type: state.docType });
      }
      function importJSON(ev) {
        const file = ev.target.files && ev.target.files[0];
        ev.target.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            applyData(JSON.parse(reader.result));
            track("doc_import", { doc_type: state.docType });
          } catch (err) {
            alert("เปิดไฟล์ไม่ได้ — ไม่ใช่ไฟล์ .json ของ UP Docs");
          }
        };
        reader.readAsText(file);
      }

      /* ===== Export .docx (ฟีเจอร์ขาย — Word แก้ไขได้ ตรง format ราชการ) =====
   สร้าง OOXML + ZIP เองในเบราว์เซอร์ ไม่มี dependency ภายนอก (ตามข้อกำหนด single-file) */
      const _CRC = (() => {
        const t = [];
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++)
            c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          t[n] = c >>> 0;
        }
        return t;
      })();
      function crc32(b) {
        let c = 0xffffffff;
        for (let i = 0; i < b.length; i++)
          c = _CRC[(c ^ b[i]) & 0xff] ^ (c >>> 8);
        return (c ^ 0xffffffff) >>> 0;
      }
      function strBytes(s) {
        return new TextEncoder().encode(s);
      }
      function b64ToBytes(b64) {
        const bin = atob(b64),
          a = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
        return a;
      }
      function xesc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&apos;",
            })[c],
        );
      }
      // ZIP แบบ store (ไม่บีบอัด) — DOCX เปิดได้ปกติ
      function zipStore(files) {
        const u16 = (n) => [n & 255, (n >>> 8) & 255],
          u32 = (n) => [
            n & 255,
            (n >>> 8) & 255,
            (n >>> 16) & 255,
            (n >>> 24) & 255,
          ];
        const parts = [],
          central = [];
        let off = 0;
        files.forEach((f) => {
          const nb = strBytes(f.name),
            crc = crc32(f.data),
            sz = f.data.length;
          parts.push(
            new Uint8Array([
              0x50,
              0x4b,
              3,
              4,
              ...u16(20),
              ...u16(0),
              ...u16(0),
              ...u16(0),
              ...u16(0),
              ...u32(crc),
              ...u32(sz),
              ...u32(sz),
              ...u16(nb.length),
              ...u16(0),
            ]),
            nb,
            f.data,
          );
          central.push({ crc, sz, nb, off });
          off += 30 + nb.length + sz;
        });
        let cd = [],
          cdSize = 0;
        central.forEach((c) => {
          cd.push(
            new Uint8Array([
              0x50,
              0x4b,
              1,
              2,
              ...u16(20),
              ...u16(20),
              ...u16(0),
              ...u16(0),
              ...u16(0),
              ...u16(0),
              ...u32(c.crc),
              ...u32(c.sz),
              ...u32(c.sz),
              ...u16(c.nb.length),
              ...u16(0),
              ...u16(0),
              ...u16(0),
              ...u16(0),
              ...u32(0),
              ...u32(c.off),
            ]),
            c.nb,
          );
          cdSize += 46 + c.nb.length;
        });
        const end = new Uint8Array([
          0x50,
          0x4b,
          5,
          6,
          ...u16(0),
          ...u16(0),
          ...u16(central.length),
          ...u16(central.length),
          ...u32(cdSize),
          ...u32(off),
          ...u16(0),
        ]);
        return new Blob([...parts, ...cd, end], {
          type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        });
      }

      const TW = (cm) => Math.round(cm * 567); // ซม. → twips
      const JCMAP = {
        thai_justify: "both", // justify มาตรฐาน (Google Docs/LibreOffice รองรับแน่ · thaiDistribute เด้งเป็นชิดซ้ายในบางแอป)
        center: "center",
        right: "right",
      };
      function dxRun(text, extra, sz) {
        sz = sz || 32;
        return (
          '<w:r><w:rPr><w:rFonts w:ascii="TH Sarabun New" w:hAnsi="TH Sarabun New" w:cs="TH Sarabun New"/>' +
          (extra || "") +
          '<w:sz w:val="' +
          sz +
          '"/><w:szCs w:val="' +
          sz +
          '"/></w:rPr><w:t xml:space="preserve">' +
          xesc(text) +
          "</w:t></w:r>"
        );
      }
      const DXTAB =
        '<w:r><w:rPr><w:rFonts w:ascii="TH Sarabun New" w:hAnsi="TH Sarabun New" w:cs="TH Sarabun New"/><w:sz w:val="32"/><w:szCs w:val="32"/></w:rPr><w:tab/></w:r>';
      function dxPara(runs, o) {
        o = o || {};
        let p = "<w:pPr>";
        if (o.tabs) p += o.tabs;
        p +=
          '<w:spacing w:before="' +
          (o.before || 0) +
          '" w:after="0" w:line="240" w:lineRule="auto"/>';
        if (o.indLeft != null || o.indFirst != null || o.indRight != null) {
          p += "<w:ind";
          if (o.indLeft != null) p += ' w:left="' + o.indLeft + '"';
          if (o.indRight != null) p += ' w:right="' + o.indRight + '"';
          if (o.indFirst != null) p += ' w:firstLine="' + o.indFirst + '"';
          p += "/>";
        }
        if (o.jc) p += '<w:jc w:val="' + o.jc + '"/>';
        p += "</w:pPr>";
        return "<w:p>" + p + (runs || "") + "</w:p>";
      }
      function tokPlain(text, modeObj) {
        return String(text).replace(/\{\{([^}]+)\}\}/g, (all, key) => {
          const v = resolveToken(key.trim(), modeObj);
          return v && v.html ? "" : v || "";
        });
      }
      // กึ่งกลางหน้ากระดาษ (ตรงแนวตรา): jc center + เยื้องขวา 1cm ชดเชยขอบซ้าย/ขวาไม่เท่ากัน
      const PAGECTR = { jc: "center", indRight: 567 };
      function dxSigner() {
        const sg = currentSigner();
        let out = "";
        for (let i = 0; i < 3; i++) out += dxPara("", PAGECTR); // เว้น 3 บรรทัดเซ็นชื่อ (ตาม format)
        out += dxPara(dxRun("(" + (sg.name || "") + ")"), PAGECTR);
        sg.title_lines.forEach((l) => (out += dxPara(dxRun(l), PAGECTR)));
        return out;
      }
      function dxField(b, modeObj, contentW) {
        if (b.text.includes("{{blank}}")) {
          const parts = b.text.split("{{blank}}"),
            n = parts.length - 1;
          let tabs = "<w:tabs>";
          for (let i = 1; i <= n; i++)
            tabs +=
              '<w:tab w:val="left" w:leader="dot" w:pos="' +
              Math.round((contentW * i) / n) +
              '"/>';
          tabs += "</w:tabs>";
          let runs = "";
          parts.forEach((seg, idx) => {
            if (seg) runs += dxRun(tokPlain(seg, modeObj));
            if (idx < parts.length - 1) runs += DXTAB;
          });
          return dxPara(runs, {
            tabs,
            before: b.space_before_pt ? b.space_before_pt * 20 : 0,
          });
        }
        const o = { before: b.space_before_pt ? b.space_before_pt * 20 : 0 };
        if (b.align && JCMAP[b.align]) o.jc = JCMAP[b.align];
        return dxPara(dxRun(tokPlain(b.text, modeObj)), o);
      }
      function dxBlock(b, modeObj, contentW) {
        switch (b.type) {
          case "subject":
          case "recipient":
          case "attach":
            return dxPara(dxRun(tokPlain(b.text, modeObj)), {
              before: b.space_before_pt != null ? b.space_before_pt * 20 : 120,
            });
          case "para": {
            const o = {
              before: b.space_before_pt != null ? b.space_before_pt * 20 : 120,
              indFirst: TW(2.5), // ทุกย่อหน้าเนื้อความ เยื้องบรรทัดแรก 2.5cm ให้ตรงกันหมด
            };
            if (b.align && JCMAP[b.align]) o.jc = JCMAP[b.align];
            return dxPara(dxRun(tokPlain(b.text, modeObj)), o);
          }
          case "closing":
            return dxPara(dxRun(b.text), { jc: "center", indRight: 567, before: 240 });
          case "signer":
            return dxSigner();
          case "list_numbered":
            return effStudents()
              .map((s, i) => {
                const line = b.item
                  .replace("{{no}}", thNum(i + 1))
                  .replace("{{student.name}}", s.name || "")
                  .replace("{{student.phone}}", thNum(s.phone || ""));
                return dxPara(dxRun(line), {
                  indLeft: TW(1.25),
                  indFirst: TW(1.25),
                  before: i === 0 ? 240 : 0,
                  jc: "thaiDistribute",
                });
              })
              .join("");
          case "list_names":
            return effStudents()
              .map((s) => dxPara(dxRun(s.name || ""), { jc: "center" }))
              .join("");
          case "title":
            return dxPara(
              dxRun(tokPlain(b.text, modeObj), "<w:b/><w:bCs/>", 44),
              {
                jc: "center",
                before: b.space_before_pt ? b.space_before_pt * 20 : 0,
              },
            );
          case "field":
            return dxField(b, modeObj, contentW);
          case "signline":
            return b.lines
              .map((l, i) =>
                dxPara(dxRun(l), {
                  indLeft: Math.max(0, contentW - TW(9.5)),
                  before: i === 0 ? 240 : 0,
                }),
              )
              .join("");
          default:
            return dxPara(dxRun(tokPlain(b.text, modeObj)), { before: 120 });
        }
      }
      function dxHeader(crest, imgRel, contentW) {
        const c = TPL._shared_chrome.header;
        let out = "";
        if (crest && imgRel) {
          const cy = Math.round(2.7 * 360000),
            cx = Math.round((cy * crest.w) / crest.h);
          out +=
            '<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:drawing>' +
            '<wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="' +
            cx +
            '" cy="' +
            cy +
            '"/><wp:docPr id="1" name="crest"/>' +
            '<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic>' +
            '<pic:nvPicPr><pic:cNvPr id="1" name="crest"/><pic:cNvPicPr/></pic:nvPicPr>' +
            '<pic:blipFill><a:blip r:embed="' +
            imgRel +
            '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
            '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' +
            cx +
            '" cy="' +
            cy +
            '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>' +
            "</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>";
        }
        const lw = Math.round(contentW * 0.5),
          rw = contentW - lw;
        const nb =
          '<w:tblBorders><w:top w:val="none" w:sz="0" w:space="0"/><w:left w:val="none" w:sz="0" w:space="0"/><w:bottom w:val="none" w:sz="0" w:space="0"/><w:right w:val="none" w:sz="0" w:space="0"/><w:insideH w:val="none" w:sz="0" w:space="0"/><w:insideV w:val="none" w:sz="0" w:space="0"/></w:tblBorders>';
        const lc =
          '<w:tc><w:tcPr><w:tcW w:w="' +
          lw +
          '" w:type="dxa"/></w:tcPr>' +
          dxPara(dxRun(tokPlain(c.left))) +
          "</w:tc>";
        const rc =
          '<w:tc><w:tcPr><w:tcW w:w="' +
          rw +
          '" w:type="dxa"/></w:tcPr>' +
          c.right_lines.map((l) => dxPara(dxRun(l))).join("") +
          "</w:tc>";
        out +=
          '<w:tbl><w:tblPr><w:tblW w:w="' +
          contentW +
          '" w:type="dxa"/>' +
          nb +
          '<w:tblCellMar><w:left w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar></w:tblPr>' +
          '<w:tblGrid><w:gridCol w:w="' +
          lw +
          '"/><w:gridCol w:w="' +
          rw +
          '"/></w:tblGrid><w:tr>' +
          lc +
          rc +
          "</w:tr></w:tbl>";
        return out;
      }
      function dxSection(docKey, modeKey, crest, imgRel) {
        const d = TPL.documents[docKey],
          modeObj = d.modeText?.[modeKey] || {};
        const mg =
          d.margins === "acceptance_form"
            ? REF.margins_cm.acceptance_form
            : REF.margins_cm.letter_head;
        const isA4 = d.paper === "a4",
          pw = isA4 ? 11906 : 12240,
          ph = isA4 ? 16838 : 15840;
        const contentW = pw - TW(mg.left) - TW(mg.right);
        const sectPr =
          '<w:sectPr><w:pgSz w:w="' +
          pw +
          '" w:h="' +
          ph +
          '"/><w:pgMar w:top="' +
          TW(mg.top) +
          '" w:right="' +
          TW(mg.right) +
          '" w:bottom="' +
          TW(mg.bottom) +
          '" w:left="' +
          TW(mg.left) +
          '" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>';
        let paras = "";
        (d.chrome || []).forEach((k) => {
          if (k === "header") paras += dxHeader(crest, imgRel, contentW);
          if (k === "date")
            paras += dxPara(dxRun(dateText()), {
              jc: "center",
              indRight: 567,
              before: 120,
            }); // วันที่ กึ่งกลางหน้า (ตรงแนวตรา)
        });
        const body = Array.isArray(d.body)
          ? d.body
          : effStudents().length > 1 && d.body.many
            ? d.body.many
            : d.body.single;
        body.forEach((b) => {
          paras += dxBlock(b, modeObj, contentW);
        });
        if (d.footer)
          paras += TPL._shared_chrome.footer.lines
            .map((l) => dxPara(dxRun(l), { before: 120 }))
            .join("");
        return { paras, sectPr };
      }
      function crestPng() {
        return new Promise((resolve) => {
          if (!CREST_DATA) {
            resolve(null);
            return;
          }
          const img = new Image();
          img.onload = () => {
            const h = 440,
              w = Math.round((h * img.width) / img.height);
            const cv = document.createElement("canvas");
            cv.width = w;
            cv.height = h;
            cv.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve({
              bytes: b64ToBytes(cv.toDataURL("image/png").split(",")[1]),
              w,
              h,
            });
          };
          img.onerror = () => resolve(null);
          img.src = CREST_DATA;
        });
      }
      async function buildDocxBlob() {

          rels = [];

          dxSection(
            j.key,
            j.mode,
            i === 0 ? crest : null,
            i === 0 ? imgRel : "",

        secs.forEach((s, i) => {
          body += s.paras;
          body +=
            i < secs.length - 1

        });
        const NS =
          'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
        const documentXml =
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ' +
          NS +
          "><w:body>" +
          body +
          "</w:body></w:document>";
        // styles.xml — docDefaults (ฟอนต์/ขนาด/ระยะบรรทัดเดี่ยว/ไม่เว้นย่อหน้า)
        // จำเป็นมากสำหรับ Google Docs/LibreOffice — ถ้าไม่มี เขาจะใส่ค่า default ตัวเองทับ (เพี้ยนหมด)
        const stylesXml =
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
          "<w:docDefaults><w:rPrDefault><w:rPr>" +
          '<w:rFonts w:ascii="TH Sarabun New" w:hAnsi="TH Sarabun New" w:cs="TH Sarabun New"/><w:sz w:val="32"/><w:szCs w:val="32"/><w:lang w:val="th-TH" w:bidi="th-TH"/>' +
          "</w:rPr></w:rPrDefault><w:pPrDefault><w:pPr>" +
          '<w:spacing w:after="0" w:line="240" w:lineRule="auto"/>' +
          "</w:pPr></w:pPrDefault></w:docDefaults>" +
          '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>' +
          "</w:styles>";
        const settingsXml =
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:defaultTabStop w:val="720"/></w:settings>';
        rels.push(
          '<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>',
          '<Relationship Id="rIdSettings" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>',
        );
        const ct =
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
          (crest ? '<Default Extension="png" ContentType="image/png"/>' : "") +
          '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
          '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
          '<Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/></Types>';
        const rootRels =
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
        const docRels =
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
          rels.join("") +
          "</Relationships>";
        return zipStore([
          { name: "[Content_Types].xml", data: strBytes(ct) },
          { name: "_rels/.rels", data: strBytes(rootRels) },
          { name: "word/_rels/document.xml.rels", data: strBytes(docRels) },
          { name: "word/document.xml", data: strBytes(documentXml) },
          { name: "word/styles.xml", data: strBytes(stylesXml) },
          { name: "word/settings.xml", data: strBytes(settingsXml) },
          ...media,
        ]);
      }
      async function exportDocx() {
        const btn = document.getElementById("docxBtn");
        if (!btn) return;
        const old = btn.textContent;
        btn.textContent = "กำลังสร้างไฟล์ Word…";
        btn.disabled = true;
        try {
          const blob = await buildDocxBlob();
          const url = URL.createObjectURL(blob),
            a = document.createElement("a");
          a.href = url;
          a.download = docBaseName() + ".docx";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          track("doc_docx", { doc_type: state.docType, doc_mode: state.mode });
        } catch (e) {
          alert("สร้างไฟล์ Word ไม่สำเร็จ: " + e.message);
        } finally {
          btn.textContent = old;
          btn.disabled = false;
        }
      }

      /* ===== token → ค่า ===== */
      function dateText() {
        const d = state.date;
        if (!d.month && !d.yearBE && !d.day) return "";
        const day = d.day ? thNum(d.day) + " " : ""; // มีวัน = แสดงเต็ม / ไม่มี = เดือน+ปี ตามค่ามาตรฐานราชการ
        return (day + (d.month || "") + " " + thNum(d.yearBE || "")).trim();
      }
      function studentNamesInline() {
        const names = effStudents()
          .map((s) => s.name)
          .filter(Boolean);
        if (!names.length) return "";
        if (names.length === 1) return names[0];
        return (
          names.slice(0, -1).join(" , ") + " และ" + names[names.length - 1]
        );
      }
      function resolveToken(key, modeObj) {
        const stu = effStudents();
        if (key === "docNo_prefix") return REF.issuer.doc_no_prefix;
        if (key === "blank")
          return { html: '<span class="blank">&nbsp;</span>' };
        if (key.startsWith("mode.")) return modeObj?.[key.slice(5)] ?? "";
        const m = key.match(/^student\.(\d)\.(name|phone)$/);
        if (m) {
          const s = stu[+m[1] - 1];
          if (!s) return "";
          return m[2] === "phone" ? thNum(s.phone) : s.name;
        }
        switch (key) {
          case "docNo":
            return thNum(state.docNo);
          case "dateText":
            return dateText();
          case "attachCount":
            return thNum(1); // สิ่งที่ส่งมาด้วย = ๑ ฉบับ เสมอ (ใช้รวมกันได้ ไม่ยึดจำนวนนิสิต)
          case "studentCount":
            return thNum(stu.length);
          case "yearEduBE":
          case "yearLevel":
          case "refDocNo":
          case "courseCode":
            return thNum(state[key]);
          case "dateStart":
          case "dateEnd":
          case "replyBy":
          case "refDate":
            return thNum(state[key]);
          case "dateRange":
            return state.dateStart || state.dateEnd
              ? thNum(state.dateStart) + " ถึง " + thNum(state.dateEnd)
              : "";
          case "studentNamesInline":
            return studentNamesInline();
          default:
            return state[key] ?? "";
        }
      }
      // แทน {{token}} ในข้อความ — ช่องว่างที่ยังไม่กรอกจะขึ้นเส้นประ (ไฮไลต์เฉพาะบนจอ)
      function tok(text, modeObj) {
        return text.replace(/\{\{([^}]+)\}\}|([^{]+|\{)/g, (all, key, lit) => {
          if (lit !== undefined) return esc(lit);
          const v = resolveToken(key.trim(), modeObj);
          if (v && v.html) return v.html;
          return v ? esc(v) : '<span class="miss">&nbsp;</span>';
        });
      }

      /* ===== เรนเดอร์บล็อกเอกสารตามสเปก templates.json ===== */
      function paraHTML(b, modeObj) {
        const cls = [];
        if (b.align === "thai_justify") cls.push("just");
        if (b.align === "center") cls.push("ctr");
        if (b.align === "right") cls.push("rgt");
        // center_ish (คำลงท้าย/ผู้ลงนาม): กึ่งกลางหน้ากระดาษ = ตรงแนวตรา
        if (b.align === "center_ish") cls.push("sig-align");
        // ทุกย่อหน้าเนื้อความ เยื้องบรรทัดแรก 2.5cm ให้ตรงกันหมด (บางย่อหน้าต้นฉบับไม่เยื้อง)
        if (b.type === "para") cls.push("ind2");
        else if (b.indent === "firstline2tab") cls.push("ind2");
        else if (b.indent === "firstline1tab") cls.push("ind1");
        if (b.type === "title") cls.push("doctitle");
        // แผนผังราชการบังคับ: เรื่อง/เรียน/อ้างถึง/สิ่งที่ส่งมาด้วย เว้นก่อนหน้า 6pt (ทุกไฟล์ต้นฉบับมี before=6pt)
        const HEADER_LINES = { subject: 1, recipient: 1, attach: 1 };
        const before = b.space_before_pt ?? (HEADER_LINES[b.type] ? 6 : 0);
        const st = [];
        // "ขอแสดงความนับถือ" เว้นก่อนหน้า ~2 บรรทัด (ผ่านตัวแปร --closegap ที่ fitAll ปรับได้)
        if (b.type === "closing") cls.push("closing-gap");
        else if (before) st.push("margin-top:" + before + "pt");
        return `<p class="${cls.join(" ")}" style="${st.join(";")}">${tok(b.text, modeObj)}</p>`;
      }
      // สร้าง object ผู้ลงนามที่จะเรนเดอร์ (preset จาก REF หรือที่พิมพ์เอง)
      function currentSigner() {
        if (state.signerId === "custom") {
          const c = state.customSigner;
          const title_lines = c.actingForDean
            ? [
                (c.position || "") + " ปฏิบัติการแทน",
                "คณบดีคณะบริหารธุรกิจและนิเทศศาสตร์",
              ]
            : [c.position || ""];
          return { name: c.name, title_lines };
        }
        return (
          REF.signers.find((s) => s.id === state.signerId) || REF.signers[0]
        );
      }
      function signerHTML() {
        const sg = currentSigner();
        const lines = sg.title_lines
          .map(
            (l) =>
              `<p>${l.trim() ? esc(l) : '<span class="miss">&nbsp;</span>'}</p>`,
          )
          .join("");
        const nm =
          sg.name && sg.name.trim()
            ? esc(sg.name)
            : '<span class="miss">&nbsp;&nbsp;&nbsp;&nbsp;</span>';
        return `<div class="sig-align"><div class="sigspace"></div><p>(${nm})</p>${lines}</div>`;
      }
      function renderBlock(b, modeObj) {
        switch (b.type) {
          case "list_numbered": // รายชื่อนิสิต ๑.–๔. เยื้อง 1.27ซม.
            return effStudents()
              .map((s, i) => {
                const line = b.item
                  .replace("{{no}}", thNum(i + 1))
                  .replace(
                    "{{student.name}}",
                    s.name ? esc(s.name) : '<span class="miss">&nbsp;</span>',
                  )
                  .replace(
                    "{{student.phone}}",
                    s.phone
                      ? thNum(esc(s.phone))
                      : '<span class="miss">&nbsp;</span>',
                  );
                const st =
                  i === 0 && b.space_before_pt
                    ? `margin-top:${b.space_before_pt}pt`
                    : "";
                return `<p class="stu" style="${st}">${line}</p>`;
              })
              .join("");
          case "list_names": // ใบขอบคุณหลายคน — ชื่ออย่างเดียว กึ่งกลาง
            return effStudents()
              .map(
                (s) =>
                  `<p class="ctr">${s.name ? esc(s.name) : '<span class="miss">&nbsp;</span>'}</p>`,
              )
              .join("");
          case "signer":
            return signerHTML();
          case "signline": // ช่องเซ็นของบริษัท (ใบตอบรับ)
            return `<div class="signwrap">${b.lines.map((l) => `<p>${esc(l)}</p>`).join("")}</div>`;
          case "field": // ช่องกรอกในใบตอบรับ
            if (b.text.includes("{{blank}}")) {
              // มีช่องว่าง → เส้นประยืดเต็มบรรทัด (บริษัทเขียนเอง)
              const parts = b.text.split("{{blank}}");
              let inner = "";
              parts.forEach((seg, idx) => {
                if (seg) inner += `<span class="ftx">${esc(seg)}</span>`;
                if (idx < parts.length - 1)
                  inner += `<span class="ffill"></span>`;
              });
              const mt = b.space_before_pt
                ? `margin-top:${b.space_before_pt}pt`
                : "";
              return `<div class="fieldline" style="${mt}">${inner}</div>`;
            }
            return paraHTML(b, modeObj); // field ที่มีค่า (เช่น หน่วยงาน/บริษัท) → ย่อหน้าปกติ
          default: // subject / recipient / attach / para / title / closing
            return paraHTML(b, modeObj);
        }
      }
      function headerHTML() {
        const c = TPL._shared_chrome.header;
        const right = c.right_lines.map((l) => `<p>${esc(l)}</p>`).join("");
        // ตรากึ่งกลางบนสุด (ครุฑ/ตราราชการ) แล้วตามด้วยแถว "ที่ อว..." ซ้าย / ที่อยู่ ขวา
        const crest = CREST_DATA
          ? `<div class="crestwrap"><img class="crest" src="${CREST_DATA}" alt="ตรามหาวิทยาลัยพะเยา"></div>`
          : "";
        return `${crest}<div class="docheader"><div class="dh-left"><p>${tok(c.left)}</p></div><div class="dh-right">${right}</div></div>`;
      }
      function footerHTML() {
        return `<div class="docfooter">${TPL._shared_chrome.footer.lines.map((l) => `<p>${esc(l)}</p>`).join("")}</div>`;
      }

      /* ===== ประกอบทั้งแผ่น ===== */
      function sheetHTML(docKey, modeKey) {
        const d = TPL.documents[docKey];
        const modeObj = d.modeText?.[modeKey] || {};
        const marginKey =
          d.margins === "acceptance_form" ? "acceptance_form" : "letter_head";
        const mg = REF.margins_cm[marginKey];
        let flow = "";
        (d.chrome || []).forEach((k) => {
          if (k === "header") flow += headerHTML();
          if (k === "date")
            flow += `<p class="datep">${tok(TPL._shared_chrome.date.text)}</p>`;
        });
        const body = Array.isArray(d.body)
          ? d.body
          : effStudents().length > 1 && d.body.many
            ? d.body.many
            : d.body.single;
        body.forEach((b) => {
          flow += renderBlock(b, modeObj);
        });
        const footer = d.footer ? footerHTML() : "";
        const pad = `padding:${mg.top}cm ${mg.right}cm ${mg.bottom}cm ${mg.left}cm;--ml:${mg.left}cm;--mr:${mg.right}cm`;
        // เนื้อหาอยู่ใน .sheet-flow · spacer ยืดดันฟุตเตอร์ให้อยู่ล่างสุดเสมอ (ไม่ทับเนื้อหา)
        return `<div class="sheet ${d.paper}" style="${pad}"><div class="sheet-flow">${flow}</div><div class="sheet-spacer"></div>${footer}</div>`;
      }

      /* ===== พรีวิว + บังคับ 1 หน้า ===== */
      function renderPreview() {
        if (!state.docType) return;
        const meta = DOC_META[state.docType];
        const doc = TPL.documents[state.docType];
        const pagesEl = document.getElementById("pages");
        const jobs = [
          { key: state.docType, mode: state.mode, label: doc.th_name },
        ];
        // ใบขอ → พิมพ์ใบตอบรับตามหลัง (โหมด cwie ใช้ใบตอบรับสหกิจ)
        if (state.docType === "request" && state.printAttach) {
          jobs.push({
            key: "acceptance",
            mode: state.mode === "internship" ? "internship" : "coop",
            label: "ใบตอบรับ (เอกสารแนบ — บริษัทลงนาม)",
          });
        }
        pagesEl.innerHTML = jobs
          .map(
            (j, i) =>
              `<p class="pagelabel no-print">หน้า ${i + 1} · ${esc(j.label)}</p><div class="sheetbox">${sheetHTML(j.key, j.mode)}</div>`,
          )
          .join("");
        // @page ตามกระดาษของใบหลัก (letter ทุกใบ ยกเว้นนอกหลักสูตร = A4)
        document.getElementById("pageSize").textContent =
          `@page{size:${doc.paper === "a4" ? "A4" : "letter"};margin:0}`;
        document.title = "UP Docs — " + meta.title;
        fitAll();
        rescale();
        saveState(); // autosave ทุกครั้งที่มีการแก้ไข
      }

      // บังคับ 1 หน้าเมื่อเนื้อหายาว (footer อยู่ใน flow แล้ว → วัดล้นได้จริง ไม่ทับ footer)
      // ลำดับปรับ: 1) ลดช่องว่างก่อน "ขอแสดงความนับถือ"  2) เลื่อนขึ้นชนโลโก้ได้ถึงครึ่งโลโก้  3) ย่อฟอนต์
      function fitAll() {
        const warns = [];
        document.querySelectorAll("#pages .sheet").forEach((sheet, i) => {
          sheet.style.fontSize = "";
          sheet.style.setProperty("--closegap", "24pt");
          const crestw = sheet.querySelector(".crestwrap");
          if (crestw) crestw.style.marginBottom = "";
          const over = () => sheet.scrollHeight > sheet.clientHeight + 1;

          // 1) ลดช่องว่างก่อนคำลงท้าย 24 → 8pt
          let gap = 24;
          while (over() && gap > 8) {
            gap -= 2;
            sheet.style.setProperty("--closegap", gap + "pt");
          }
          // 2) เลื่อนเนื้อหาขึ้นชนโลโก้ได้ถึง ~ครึ่งโลโก้ (ดึง header ขึ้นใต้ตราไม่เกิน 1.35 ซม.)
          let pull = 0;
          while (over() && crestw && pull < 1.35) {
            pull += 0.15;
            crestw.style.marginBottom = (0.1 - pull).toFixed(2) + "cm";
          }
          // 3) ย่อฟอนต์ 16 → 13pt
          let size = 16;
          while (over() && size > 13) {
            size -= 0.25;
            sheet.style.fontSize = size + "pt";
          }

          if (size < 16)
            warns.push(
              `หน้า ${i + 1}: เนื้อหายาว ระบบย่อฟอนต์เหลือ ${size}pt เพื่อให้จบใน 1 หน้า`,
            );
          if (over())
            warns.push(
              `หน้า ${i + 1}: เนื้อหายังยาวเกินหน้า แม้ปรับแล้ว — ลองย่อข้อความ`,
            );
        });
        const w = document.getElementById("fitWarn");
        w.style.display = warns.length ? "block" : "none";
        w.textContent = warns.join(" · ");
      }

      // ย่อพรีวิวให้พอดีความกว้างจอ (ตัวเอกสารขนาดจริงเป็น ซม.)
      function rescale() {
        const panel = document.getElementById("previewPanel");
        const avail = panel.clientWidth;
        document.querySelectorAll("#pages .sheetbox").forEach((box) => {
          const sheet = box.firstElementChild;
          sheet.style.transform = "";
          const w = sheet.offsetWidth,
            h = sheet.offsetHeight;
          const s = Math.min(1, avail / w);
          sheet.style.transform = `scale(${s})`;
          sheet.style.transformOrigin = "top left";
          box.style.width = w * s + "px";
          box.style.height = h * s + "px";
        });
      }
      window.addEventListener("resize", rescale);

      /* ===== ฟอร์ม ===== */
      function inputHTML(key) {
        const f = FIELD_DEF[key];

          const opts = f.select
            .map(

        }
        if (f.textarea)
          return `<label>${f.label}</label><textarea data-k="${key}">${esc(state[key])}</textarea>`;
        const dl = f.datalist ? `list="${f.datalist}"` : "";
        return (
          `<label>${f.label}</label><input type="text" ${f.num ? 'inputmode="numeric"' : ""} data-k="${key}" value="${esc(state[key])}" ${dl}>` +

      function studentsHTML(meta) {

      // ===== dropdown หลักสูตร/สาขา ที่สัมพันธ์กัน (คณะเดียว: บริหารธุรกิจและนิเทศศาสตร์) =====
      function programsList() {
        return REF.programs.filter((p) => !p.includes("__"));
      }
      function majorsForProgram(prog) {
        const map = REF.major_to_program || {};
        const all = REF.majors.filter((m) => !m.includes("__"));
        return prog ? all.filter((m) => map[m] === prog) : all; // ไม่เลือกหลักสูตร → โชว์ครบ 8

      function selectHTML(key, label, placeholder, list) {
        const cur = state[key];
        // ถ้าค่าปัจจุบันไม่อยู่ในลิสต์ (เช่นมาจากไฟล์เก่า/พิมพ์เอง) ยังคงโชว์เป็นตัวเลือกไว้

        const opts = [`<option value="">${placeholder}</option>`].concat(

            .concat(extra)

                `<option ${cur === v ? "selected" : ""}>${esc(v)}</option>`,

        return `<label>${label}</label><select data-sel="${key}">${opts.join("")}</select>`;

      function majorSelectHTML() {
        // ถ้าใบนี้มีช่องหลักสูตรด้วย → กรองสาขาตามหลักสูตร; ถ้าไม่มี → โชว์ครบ 8
        const hasProg = DOC_META[state.docType].fields.includes("program");
        return selectHTML(
          "major",
          "สาขาวิชา",
          "— เลือกสาขาวิชา —",
          majorsForProgram(hasProg ? state.program : ""),
        );
      }
      function signerHTMLForm() {
        const opts =
          REF.signers
            .map(
              (s) =>
                `<option value="${s.id}" ${state.signerId === s.id ? "selected" : ""}>${esc(s.name)}</option>`,
            )
            .join("") +
          `<option value="custom" ${state.signerId === "custom" ? "selected" : ""}>พิมพ์เอง…</option>`;
        const c = state.customSigner;
        const custom =
          state.signerId === "custom"
            ? `
    <div id="customSigner" style="margin-top:8px">
      <input type="text" id="csName" placeholder="ชื่อ-สกุล (พร้อมคำนำหน้า/ยศ) เช่น ผู้ช่วยศาสตราจารย์ ดร.สมชาย ใจดี" value="${esc(c.name)}">
      <input type="text" id="csPos" placeholder="ตำแหน่ง เช่น รองคณบดีฝ่ายวิชาการ" value="${esc(c.position)}" style="margin-top:6px">
      <label class="chk"><input type="checkbox" id="csActing" ${c.actingForDean ? "checked" : ""}> ลงนาม "ปฏิบัติการแทนคณบดี" (ถ้าไม่ติ๊ก = คณบดีลงนามเอง/ลงตามตำแหน่ง)</label>
    </div>`
            : "";
        return `<label>ผู้ลงนาม</label><select id="signerSel">${opts}</select>
    <div class="hint">ค่าตั้งต้นคือ อ.กมลพงศ์ฯ · เลือก "พิมพ์เอง…" เพื่อกรอกผู้ลงนามท่านอื่น</div>${custom}`;
      }
      function renderForm() {
        const meta = DOC_META[state.docType];
        const doc = TPL.documents[state.docType];
        const hasModes = (doc.modes || []).length > 1;
        const modeChips = hasModes
          ? `<fieldset><legend>ประเภทการปฏิบัติงาน</legend><div class="modechips">${doc.modes
              .map(
                (m) =>
                  `<button class="chip ${state.mode === m ? "on" : ""}" data-mode="${m}">${MODE_LABEL[m] || m}</button>`,
              )
              .join("")}</div></fieldset>`
          : "";
        const fieldsHTML = meta.fields
          .map((k) =>
            k === "date"
              ? dateInputHTML()
              : k === "program"
                ? programSelectHTML()
                : k === "major"
                  ? majorSelectHTML()
                  : inputHTML(k),
          )
          .join("");
        const attachOpt =
          state.docType === "request"
            ? `<label class="chk"><input type="checkbox" id="printAttach" ${state.printAttach ? "checked" : ""}> พิมพ์ใบตอบรับแนบท้าย (รวม 2 หน้า)</label>`
            : "";
        document.getElementById("formPanel").innerHTML = `
    <button class="backbtn" id="backBtn">← เลือกเอกสารอื่น</button>
    <h2>${meta.title}</h2>
    <p class="docsub">${esc(doc.th_name)}</p>
    ${modeChips}
    <fieldset><legend>ข้อมูลหนังสือ</legend>${fieldsHTML}</fieldset>
    <fieldset><legend>นิสิต</legend>${studentsHTML(meta)}</fieldset>
    <fieldset><legend>ผู้ลงนาม</legend>${signerHTMLForm()}</fieldset>
    ${attachOpt}
    <button class="printbtn" id="printBtn">🖨 พิมพ์ / บันทึกเป็น PDF</button>
    <button class="docxbtn" id="docxBtn">⬇ บันทึกเป็น Word (.docx) — แก้ไขต่อได้</button>
    <div class="printtip">PDF สำหรับพิมพ์/ส่ง · Word (.docx) สำหรับแก้ไขต่อในโปรแกรม Word</div>
    <div class="row" style="margin-top:10px">
      <button class="chip" id="exportBtn">⬇ บันทึกไฟล์</button>
      <button class="chip" id="importBtn">⬆ เปิดไฟล์</button>
    </div>
    <div class="printtip">💾 บันทึกอัตโนมัติในเบราว์เซอร์นี้ · ไฟล์ .json ใช้เก็บงานหรือย้ายไปทำต่อเครื่องอื่น</div>`;
        bindForm();
      }
      function bindForm() {
        const panel = document.getElementById("formPanel");
        panel.querySelectorAll("[data-k]").forEach((el) => {
          el.addEventListener("input", () => {
            state[el.dataset.k] = el.value;
            renderPreview();
          });
        });
        // dropdown หลักสูตร ↔ สาขา (สัมพันธ์กัน)
        panel.querySelectorAll("[data-sel]").forEach((el) => {
          el.addEventListener("change", () => {
            const key = el.dataset.sel; // program | major
            state[key] = el.value;
            if (key === "major") {
              const prog = (REF.major_to_program || {})[el.value];
              if (prog) state.program = prog; // เลือกสาขา → เติมหลักสูตร
            } else if (key === "program") {
              const valid = majorsForProgram(state.program);
              if (state.major && !valid.includes(state.major)) state.major = ""; // สาขาเดิมไม่เข้าหลักสูตรใหม่ → ล้าง
            }
            renderForm(); // rebuild ให้ตัวเลือกสองช่องสอดคล้องกัน
            renderPreview();
          });
        });
        panel.querySelectorAll("[data-dk]").forEach((el) => {
          el.addEventListener("input", () => {
            state.date[el.dataset.dk] = el.value;
            renderPreview();
          });
        });
        panel.querySelectorAll("[data-sk]").forEach((el) => {
          el.addEventListener("input", () => {
            state.students[+el.dataset.si][el.dataset.sk] = el.value;
            renderPreview();
          });
        });
        panel.querySelectorAll("[data-del]").forEach((el) => {
          el.addEventListener("click", () => {
            state.students.splice(+el.dataset.del, 1);
            renderForm();
            renderPreview();
          });
        });
        panel.querySelectorAll("[data-mode]").forEach((el) => {
          el.addEventListener("click", () => {
            state.mode = el.dataset.mode;
            renderForm();
            renderPreview();
          });
        });
        document.getElementById("addStu")?.addEventListener("click", () => {
          state.students.push({ name: "", phone: "" });
          renderForm();
          renderPreview();
        });
        document.getElementById("signerSel").addEventListener("change", (e) => {
          state.signerId = e.target.value;
          renderForm(); // re-render เพื่อโชว์/ซ่อนช่องพิมพ์เอง
          renderPreview();
        });
        // ช่องพิมพ์ผู้ลงนามเอง
        document.getElementById("csName")?.addEventListener("input", (e) => {
          state.customSigner.name = e.target.value;
          renderPreview();
        });
        document.getElementById("csPos")?.addEventListener("input", (e) => {
          state.customSigner.position = e.target.value;
          renderPreview();
        });
        document.getElementById("csActing")?.addEventListener("change", (e) => {
          state.customSigner.actingForDean = e.target.checked;
          renderPreview();
        });
        document
          .getElementById("printAttach")
          ?.addEventListener("change", (e) => {
            state.printAttach = e.target.checked;
            renderPreview();
          });
        document.getElementById("printBtn").addEventListener("click", printDoc);
        document
          .getElementById("docxBtn")
          .addEventListener("click", exportDocx);
        document
          .getElementById("exportBtn")
          .addEventListener("click", exportJSON);
        document
          .getElementById("importBtn")
          .addEventListener("click", () =>
            document.getElementById("importFile").click(),
          );
        document.getElementById("backBtn").addEventListener("click", () => {
          state.docType = null;
          document.getElementById("workspace").hidden = true;
          document.getElementById("docCards").style.display = "";
          document.getElementById("openSaved").style.display = "";
          document.getElementById("pages").innerHTML = "";
          document.title =
            "UP Docs — เครื่องมือออกเอกสารฝึกงาน คณะบริหารธุรกิจและนิเทศศาสตร์ ม.พะเยา";
        });
      }

      // เปิดหน้าฟอร์ม+พรีวิวของ state.docType ปัจจุบัน (ใช้ทั้งตอนคลิกการ์ด/เปิดไฟล์/กู้ autosave)
      function openWorkspace() {
        document.getElementById("docCards").style.display = "none";
        document.getElementById("openSaved").style.display = "none";
        document.getElementById("workspace").hidden = false;
        renderForm();
        renderPreview();
      }

      /* ===== หน้าเลือกเอกสาร (การ์ดใหญ่ ชัดเจน — แก้ปัญหา dropdown เดิมสับสน) ===== */
      function renderCards() {
        document.getElementById("docCards").innerHTML = Object.entries(DOC_META)
          .map(
            ([k, m]) => `
    <button class="card" data-doc="${k}">
      <h2>${m.title}</h2><p>${m.desc}</p><span class="tag">${m.tag}</span>
    </button>`,
          )
          .join("");
        document.querySelectorAll(".card").forEach((el) => {
          el.addEventListener("click", () => {
            state.docType = el.dataset.doc;
            const modes = TPL.documents[state.docType].modes || [];
            state.mode = modes[0] || "internship";
            track("doc_select", { doc_type: state.docType });
            openWorkspace();
          });
        });
      }
      renderCards();
      document
        .getElementById("importFile")
        .addEventListener("change", importJSON);

      // กู้งานล่าสุดจาก autosave (ถ้ามีและใช้ localStorage ได้)
      try {
        const saved = loadState();
        if (saved && DOC_META[saved.docType]) applyData(saved);
      } catch (e) {
        /* ไฟล์เก่าเสีย/ไม่มี — เริ่มหน้าเลือกการ์ดตามปกติ */
      }
    </script>
  </body>
</html>
